# A plugin is a folder with this file and something to run.
# Copy this folder into your plugins folder and edit it.

[plugin]
name        = "Service inventory"
description = "Reads data.json next to it and prints it as a table"
group       = "Examples"

[run]
command = ["python", "main.py"]
timeout = "30s"
every   = "1h"

[table]
# What names a row, so two runs can be lined up. Defaults to the first column.
key = "service"

# columns is a guard, not a declaration: the header line of the output always
# decides what the columns are. Written here, the run fails when the header
# stops matching, so a script that quietly renamed or reordered a column says
# so instead of reshaping the table. The cost is this list and the script
# having to agree for ever. This is the only example that uses it.
columns = ["service", "team", "environment", "version", "instances", "cpu_percent", "last_deploy"]

# The last twenty results that differ from the one before.
[history]
keep = 20
