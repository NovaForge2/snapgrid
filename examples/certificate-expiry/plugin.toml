# When each TLS certificate expires.
# Edit hosts.txt to say which hosts to watch. Nothing else to configure.

[plugin]
name        = "Certificate expiry"
description = "Expiry date and days remaining for each host in hosts.txt"
group       = "Examples"

[run]
command = ["python", "main.py"]
# Each host gets 6 seconds of its own; this is the ceiling for the whole run.
timeout = "5m"
# Certificates change perhaps twice a year. Checking every minute would be
# rude to the servers and tell you nothing new.
every   = "6h"

[table]
# What names a row, so two runs can be lined up. Defaults to the first column.
key = "host"

# Under a week is an emergency, under a month is something to book in. A
# certificate that has already expired is a negative number, so it is caught
# by "< 7" as well.
[colour.days_left]
"< 7"  = "red"
"< 30" = "amber"

# days_left counts down on its own: tomorrow every row holds a different
# number, and a comparison would mark every row as changed every day. The
# question history answers here is "when was this renewed?", which is the
# expiry date, so the countdown is left out of the comparison. It is still
# shown, sorted, filtered and coloured as before.
[compare]
ignore = ["days_left"]

# The interesting question is "when did this get renewed?", so keep history.
[history]
keep = 20
