# snapgrid has no package dependencies, and that is the point of the project,
# so there is nothing here for pip. What does need watching is the workflows:
# actions go out of support quietly, and the first sign is a warning on every
# build that people learn to scroll past.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ""          # the repository does not use prefixes
    labels: []
    open-pull-requests-limit: 3
    groups:
      # One pull request for all of them rather than three: they are always
      # reviewed together and none of them is interesting on its own.
      actions:
        patterns: ["*"]
